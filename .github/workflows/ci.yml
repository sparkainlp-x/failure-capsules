name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests (warnings are errors)
        run: python -W error -m unittest discover -s tests -v
      - name: Demo smoke run (SYNTHETIC)
        run: |
          python failure_capsules.py demo
          python failure_capsules.py validate examples/example_capsule.json
      - name: Build the Pages demo
        run: python -W error scripts/build_site.py "$RUNNER_TEMP/site"
